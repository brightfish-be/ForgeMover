; ForgeMover dev stack — https://github.com/pforret/gloncher
;
;   gloncher gloncher.ini      run the stack (q or ctrl-c stops everything)
;   gloncher -c gloncher.ini   parse only: show what it would run
;
; Run it from the laravel/ folder. First run: php artisan forgemover:setup
; (or open http://127.0.0.1:8600/setup once [web] is up).

[gloncher]
title   = ForgeMover
refresh = 100ms

; ── Web ────────────────────────────────────────────────────────────────
; Filament panel at http://127.0.0.1:8600/admin, setup wizard at /setup.
[web]
cmd     = php artisan serve --host=127.0.0.1 --port=8600
lines   = 6
width   = full
color   = green
filter  = Server running|started|error|Error|exception
on_exit = restart

; ── Queue worker ───────────────────────────────────────────────────────
; Runs the long jobs: relocation steps (collect/transfer/restore/verify,
; up to 2 h each), ssh fact probes, Forge syncs. --timeout must stay above
; the job timeout in App\Jobs\RunRelocationStep.
[queue]
cmd     = php artisan queue:work --timeout=7200 --tries=1 --sleep=2
lines   = 6
width   = full
color   = yellow
on_exit = restart

; ── Scheduler ──────────────────────────────────────────────────────────
; Hourly server probes, 6-hourly Forge sync, daily site-type detection.
[schedule]
cmd     = php artisan schedule:work
lines   = 4
width   = full
color   = blue
on_exit = restart

; ── Deliberately not here ──────────────────────────────────────────────
; * No vite dev server — Filament's compiled assets are served from
;   public/build (npm run build). Add `npm run dev` only when hacking
;   on the CSS/JS.
; * No database server — state is SQLite in database/database.sqlite.
